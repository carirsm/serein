<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Serein - Mood Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <header>
            <h1 class="site-title">SEREIN</h1>
            <nav class="main-nav">
                <a href="/" class="nav-button">Log Mood</a>
                <a href="view" class="nav-button">View Moods</a>
                <a href="stats" class="nav-button">View Stats</a>
            </nav>
        </header>
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
